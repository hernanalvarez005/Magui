name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholders: ninguno de estos jobs necesita un proyecto Supabase real
  # (login/proxy fallan "cerrado" ante un backend inalcanzable, ver proxy.ts).
  NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
  WEB_ORDERS_API_TOKEN: ci-placeholder-token

jobs:
  build-and-test:
    name: Install · Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (motor de precios, 12 casos del prompt maestro)
        run: npm run test

      - name: Build
        run: npm run build

  e2e-smoke:
    name: E2E smoke (login / rutas protegidas)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  db-tests:
    name: Supabase DB tests (pgTAP — RLS + RPC de negocio)
    runs-on: ubuntu-latest
    # Best-effort: depende de que el runner pueda levantar el stack local de
    # Supabase (Docker). No bloquea el merge si la infra de CI no lo permite;
    # los mismos tests SIEMPRE se pueden correr en local con `supabase test db`.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase start

      - name: Run pgTAP tests
        run: supabase test db

      - name: Stop Supabase local stack
        if: always()
        run: supabase stop
